  /v1/events:
    get:
      description: |-
        Returns everything that has happened on your account, most recent first, cursor-paginated.

        This is the same feed your webhook endpoints are delivered from, which makes it the recovery path when they are not: an endpoint that was down, misconfigured, or auto-disabled loses deliveries, not events. Poll here to catch up, and reconcile by `id` — an event's `evt_` id is identical in both places.

        Ordered by when things **occurred**, not when they were recorded, so a redelivery cannot reorder your feed.
      operationId: listEvents
      parameters:
      - description: "How many objects to return, 1–100. Values above the ceiling are clamped to it rather than rejected, so a client asking for more simply receives the maximum. Defaults to 25."
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      - description: A cursor for pagination. Pass the `nextCursor` from the previous response to fetch the following page. The value is opaque and signed — treat it as a token and never parse or construct one.
        in: query
        name: starting_after
        required: false
        schema:
          type: string
      - description: Return only events of this type. Must be a name from the event vocabulary — a typo is a `400` naming the valid values rather than an empty page.
        example: payment.captured
        in: query
        name: type
        required: false
        schema:
          type: string
      - description: "Return only objects created at or after this instant, as RFC 3339 (`2026-07-29T00:00:00Z`)."
        in: query
        name: created_after
        required: false
        schema:
          type: string
          format: date-time
      - description: "Return only objects created at or before this instant, as RFC 3339 (`2026-07-29T23:59:59Z`)."
        in: query
        name: created_before
        required: false
        schema:
          type: string
          format: date-time
      - description: "Pin this one request to a dated API revision. Overrides the revision your account is pinned to; omit it to use that pin, or the current revision if you have none. An unrecognised value is rejected with `400 UNSUPPORTED_API_VERSION` rather than silently ignored."
        in: header
        name: PaymentFlow-Version
        required: false
        schema:
          type: string
          example: 2026-08-01
      - description: "Your own identifier for this operation, echoed back on the response and recorded on every log line it produces. Send one to join your logs to PaymentFlow's; omit it and one is generated for you."
        in: header
        name: X-Correlation-Id
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageEventResponse"
          description: "A page of events, most recent first."
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Link:
