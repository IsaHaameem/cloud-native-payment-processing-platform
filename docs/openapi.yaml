    DecisionLogEntryResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
          description: "When the decision was made, as RFC 3339."
        decisionKey:
          type: string
          description: "The idempotency key this decision was made under. Re-deciding with the same key returns the original verdict rather than deciding again, so a retry cannot change an outcome your integration already saw."
        declineCode:
          type: string
          description: "The decline code returned, when the outcome was a decline."
          example: insufficient_funds
        deferredDelayMs:
          type: integer
          format: int32
          description: "How long the deferred outcome was scheduled to wait, in milliseconds."
          example: 5000
        deferredOperation:
          type: string
          description: "The operation whose outcome was deferred, when the decision scheduled one for later."
          example: CAPTURE
        errorCode:
          type: string
          description: "The error code returned, when the outcome was an error."
          example: processor_unavailable
        latencyMs:
          type: integer
          format: int32
          description: "How long the simulated acquirer took to answer, in milliseconds."
          example: 0
        operation:
          type: string
          description: "Which operation was being decided — an authorization, a capture, a refund."
          example: AUTHORIZE
        outcome:
          type: string
          description: What the simulated acquirer decided.
          example: APPROVE
        overrideId:
          type: string
          format: uuid
          description: "The simulation override that produced this decision, when `source` names one. A bare reference rather than the override's contents — enough to know one was involved without this endpoint re-exposing the simulation control surface."
        paymentId:
          type: string
          format: uuid
          description: The payment this decision was made about.
        source:
          type: string
          description: "**Why the outcome was what it was**: the test card's own catalogue entry, an active simulation override, or the mode's default. This is the field that turns a surprising result into an explained one."
          example: TEST_CARD
    EventResponse:
      type: object
      properties:
        created:
          type: string
          format: date-time
          description: "When the event occurred — not when it was recorded. Events are ordered by this, so a redelivery cannot reorder your feed."
        data:
          type: object
          additionalProperties: true
          description: "The event payload — the object the event happened to, as it was at the time. Its shape depends on `type` and is the same body your webhook endpoint received. Stored verbatim: audit-service records what it was given rather than a typed view it would then have to keep in step."
        id:
          type: string
          description: "Unique identifier for this event, `evt_` followed by 32 hex characters. **Byte-identical to the `id` in the webhook body you received for the same event**, so a webhook can be reconciled against this log without storing anything extra."
          example: evt_9f2c1e7a4b8d4c3e8a1d2b4f6a8c05d1
        mode:
          type: string
          description: Whether this event describes `test` or `live` activity.
          enum:
          - test
          - live
          example: test
        object:
          type: string
          description: Always `event`. The discriminator that identifies this object out of context.
          example: event
        type:
          type: string
          description: "What happened, from the frozen event vocabulary — `payment.created`, `payment.authorized`, `payment.captured`, `payment.refunded`, `payment.voided`, `payment.failed`. **New types may be added without a new API revision**, so treat an unrecognised type as one you do not handle."
          example: payment.captured
