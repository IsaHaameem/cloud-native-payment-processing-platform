openapi: 3.1.0
info:
  description: |-
    The PaymentFlow payments API. This document describes the public `/v1` surface — the endpoints PaymentFlow versions, deprecates on a published timeline, and supports for integrators. Endpoints not described here are internal and carry no compatibility promise.

    Amounts are integers in the currency's minor unit (`amountMinor`): `1000` in `USD` is $10.00. There are no floating-point amounts anywhere in this API.

    Every mutating request accepts an `Idempotency-Key` header and every list is cursor-paginated; both are described on the operations that use them.
  license:
    name: Proprietary
  title: PaymentFlow API
  version: 2026-08-01
servers:
- url: https://api.paymentflow.dev
  description: PaymentFlow API
security:
- SecretKey: []
paths:
  /v1/analytics/payments:
    get:
      description: |-
        Returns totals and an hourly series for your payment activity over a window, in one round trip — a dashboard renders both on one screen, so splitting them across endpoints would mean two queries over the same rows.

        `successRate` is computed here rather than left to you, because there is more than one defensible denominator and a platform that returns raw counters invites every client to pick a different one. The published definition is `authorized / (authorized + failed)`.

        The hourly series begins where this platform started recording it; totals are complete, but a window reaching further back than the series will show fewer buckets than hours.
      operationId: getPaymentAnalytics
      parameters:
      - description: "The start of the window, as RFC 3339. Defaults to 24 hours ago."
        example: 2026-07-28T00:00:00Z
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - description: "The end of the window, as RFC 3339. Defaults to now."
        example: 2026-07-29T00:00:00Z
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - description: "Pin this one request to a dated API revision. Overrides the revision your account is pinned to; omit it to use that pin, or the current revision if you have none. An unrecognised value is rejected with `400 UNSUPPORTED_API_VERSION` rather than silently ignored."
        in: header
        name: PaymentFlow-Version
        required: false
        schema:
          type: string
          example: 2026-08-01
      - description: "Your own identifier for this operation, echoed back on the response and recorded on every log line it produces. Send one to join your logs to PaymentFlow's; omit it and one is generated for you."
        in: header
        name: X-Correlation-Id
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummaryResponse"
          description: "Totals for the window, and the hourly series behind them."
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Link:
              $ref: "#/components/headers/Link"
            PaymentFlow-Version:
              $ref: "#/components/headers/PaymentFlow-Version"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Sunset:
              $ref: "#/components/headers/Sunset"
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
        "401":
          content:
            application/json:
              example:
                code: UNAUTHORIZED
                correlationId: 3f9a1c2e-77b4-4a1d-9c3e-1d2b4f6a8c05
                docUrl: https://docs.paymentflow.dev/errors#unauthorized
                message: Authentication is required or has failed.
                path: /v1/payments
                requestId: req_9f2c1e7a4b8d
                status: 401
                timestamp: 2026-07-28T12:34:56.789Z
                type: authentication_error
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication is required or has failed.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
        "403":
          content:
            application/json:
              example:
                code: INSUFFICIENT_SCOPE
                correlationId: 3f9a1c2e-77b4-4a1d-9c3e-1d2b4f6a8c05
                docUrl: https://docs.paymentflow.dev/errors#insufficient_scope
                message: This API key does not have the required scope for this endpoint.
                path: /v1/payments
                requestId: req_9f2c1e7a4b8d
                status: 403
                timestamp: 2026-07-28T12:34:56.789Z
                type: permission_error
              schema:
                $ref: "#/components/schemas/ApiError"
          description: This API key does not have the required scope for this endpoint.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
        "429":
          content:
            application/json:
              example:
                code: RATE_LIMIT_EXCEEDED
                correlationId: 3f9a1c2e-77b4-4a1d-9c3e-1d2b4f6a8c05
                docUrl: https://docs.paymentflow.dev/errors#rate_limit_exceeded
                message: Too many requests. Slow down and retry after the interval in the Retry-After header.
                path: /v1/payments
                requestId: req_9f2c1e7a4b8d
                status: 429
                timestamp: 2026-07-28T12:34:56.789Z
                type: rate_limit_error
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Too many requests. Slow down and retry after the interval in the Retry-After header.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Retry-After:
              $ref: "#/components/headers/Retry-After"
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
        "500":
          content:
            application/json:
              example:
                code: INTERNAL_ERROR
                correlationId: 3f9a1c2e-77b4-4a1d-9c3e-1d2b4f6a8c05
                docUrl: https://docs.paymentflow.dev/errors#internal_error
                message: An unexpected error occurred.
                path: /v1/payments
                requestId: req_9f2c1e7a4b8d
                status: 500
                timestamp: 2026-07-28T12:34:56.789Z
                type: api_error
              schema:
                $ref: "#/components/schemas/ApiError"
          description: An unexpected error occurred.
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Link:
              $ref: "#/components/headers/Link"
            PaymentFlow-Version:
              $ref: "#/components/headers/PaymentFlow-Version"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Sunset:
              $ref: "#/components/headers/Sunset"
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
      summary: Summarize payment activity
      tags:
      - Analytics
  /v1/balance:
    get:
      description: |-
        Returns what you hold, per currency, in the mode of the key you called with.

        Two figures per currency, and the difference matters: `pendingMinor` is money authorized but not yet captured — it can still be voided or expire, so it is not yours — while `availableMinor` is money captured and owed to you, net of refunds. Both are projections of the double-entry ledger rather than counters kept alongside it, so they cannot drift from the entries at `/v1/balance_transactions`.
      operationId: getBalance
      parameters:
      - description: "Pin this one request to a dated API revision. Overrides the revision your account is pinned to; omit it to use that pin, or the current revision if you have none. An unrecognised value is rejected with `400 UNSUPPORTED_API_VERSION` rather than silently ignored."
