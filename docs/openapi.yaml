  /v1/refunds:
    get:
      description: |-
        Returns the refunds you have issued, most recent first, cursor-paginated on the same contract as the payments list.

        Refunds became first-class objects in this platform's M19 release, so this list starts there — a payment refunded before then carries the refunded total on the payment itself but has no refund object here.
      operationId: listRefunds
      parameters:
      - description: "How many objects to return, 1–100. Values above the ceiling are clamped to it rather than rejected, so a client asking for more simply receives the maximum. Defaults to 25."
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      - description: A cursor for pagination. Pass the `nextCursor` from the previous response to fetch the following page. The value is opaque and signed — treat it as a token and never parse or construct one.
        in: query
        name: starting_after
        required: false
        schema:
          type: string
      - description: Return only refunds issued against this payment.
        in: query
        name: payment
        required: false
        schema:
          type: string
          format: uuid
      - description: Return only refunds in this state.
        example: succeeded
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: "Return only objects created at or after this instant, as RFC 3339 (`2026-07-29T00:00:00Z`)."
        in: query
        name: created_after
        required: false
        schema:
          type: string
          format: date-time
      - description: "Return only objects created at or before this instant, as RFC 3339 (`2026-07-29T23:59:59Z`)."
        in: query
        name: created_before
        required: false
        schema:
          type: string
          format: date-time
      - description: "Filter by metadata, spelled `metadata[key]=value` and repeatable. Matching is containment and every named key must match: `?metadata[orderId]=A-1234&metadata[channel]=web` returns only objects carrying both. A key nothing carries selects nothing rather than everything."
        explode: true
        in: query
        name: metadata
        schema:
          type: object
          additionalProperties: true
        style: deepObject
      - description: "Pin this one request to a dated API revision. Overrides the revision your account is pinned to; omit it to use that pin, or the current revision if you have none. An unrecognised value is rejected with `400 UNSUPPORTED_API_VERSION` rather than silently ignored."
