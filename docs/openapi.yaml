  /v1/webhook_endpoints/{id}/rotate_secret:
    post:
      description: |-
        Issues a new signing secret for the endpoint and returns it — the second and only other place a raw secret is ever shown.

        **Both secrets verify during a grace window**, so you can deploy the new one without dropping in-flight deliveries: rotate, deploy, and let the old secret lapse. Verifying against either during that window is the intended behaviour, not a weakness.

        Rotate when a secret may have been exposed, or when you have lost the one you were shown at registration — it cannot be recovered, only replaced.
