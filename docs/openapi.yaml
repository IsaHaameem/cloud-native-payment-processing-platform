  /v1/payments:
    get:
      description: |-
        Returns your payments, most recent first, cursor-paginated.

        Pagination is cursor-based rather than offset-based because this list is append-heavy: under concurrent inserts an offset page silently skips rows, which on a financial list is a correctness bug rather than a cosmetic one. Follow `nextCursor` until `hasMore` is false.

        Every filter combines with `AND`. The list is always scoped to your own merchant and to the mode of the key you called with.
      operationId: listPayments
      parameters:
      - description: "How many objects to return, 1–100. Values above the ceiling are clamped to it rather than rejected, so a client asking for more simply receives the maximum. Defaults to 25."
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      - description: A cursor for pagination. Pass the `nextCursor` from the previous response to fetch the following page. The value is opaque and signed — treat it as a token and never parse or construct one.
        in: query
        name: starting_after
        required: false
        schema:
          type: string
      - description: Return only payments in this state. Must be one of the statuses this revision defines — a typo is a `400` naming the vocabulary rather than an empty page you then have to explain to yourself.
        example: authorized
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: Return only payments in this ISO 4217 currency.
        example: USD
        in: query
        name: currency
        required: false
        schema:
          type: string
      - description: "Return only payments of at least this amount, in minor units."
        example: 1000
        in: query
        name: amount_min
        required: false
        schema:
          type: integer
          format: int64
      - description: "Return only payments of at most this amount, in minor units."
        example: 100000
        in: query
        name: amount_max
        required: false
        schema:
          type: integer
          format: int64
      - description: "Return only objects created at or after this instant, as RFC 3339 (`2026-07-29T00:00:00Z`)."
        in: query
        name: created_after
        required: false
        schema:
          type: string
          format: date-time
      - description: "Return only objects created at or before this instant, as RFC 3339 (`2026-07-29T23:59:59Z`)."
        in: query
        name: created_before
        required: false
        schema:
          type: string
          format: date-time
      - description: "Ask for related objects to be included inline. The only expandable relation on this resource is `refunds`. A relation this revision does not have is ignored rather than rejected, so an SDK written against a later version still works here."
        example: refunds
        in: query
        name: expand
        required: false
        schema:
          type: string
      - description: "Filter by metadata, spelled `metadata[key]=value` and repeatable. Matching is containment and every named key must match: `?metadata[orderId]=A-1234&metadata[channel]=web` returns only objects carrying both. A key nothing carries selects nothing rather than everything."
        explode: true
        in: query
        name: metadata
        schema:
          type: object
          additionalProperties: true
        style: deepObject
      - description: "Pin this one request to a dated API revision. Overrides the revision your account is pinned to; omit it to use that pin, or the current revision if you have none. An unrecognised value is rejected with `400 UNSUPPORTED_API_VERSION` rather than silently ignored."
        in: header
        name: PaymentFlow-Version
        required: false
        schema:
          type: string
          example: 2026-08-01
      - description: "Your own identifier for this operation, echoed back on the response and recorded on every log line it produces. Send one to join your logs to PaymentFlow's; omit it and one is generated for you."
        in: header
        name: X-Correlation-Id
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPagePaymentResponse"
          description: "A page of payments, most recent first."
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Link:
              $ref: "#/components/headers/Link"
            PaymentFlow-Version:
              $ref: "#/components/headers/PaymentFlow-Version"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Sunset:
