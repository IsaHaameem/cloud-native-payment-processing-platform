    PaymentResponse:
      type: object
      properties:
        amountMinor:
          type: integer
          format: int64
          description: "The amount authorized, as an integer in the currency's minor unit: `1000` in `USD` is $10.00."
          example: 1000
        capturedAmountMinor:
          type: integer
          format: int64
          description: "How much of the authorized amount has been captured so far, in minor units."
          example: 1000
        createdAt:
          type: string
          format: date-time
          description: "When the payment was created, as RFC 3339."
        currency:
          type: string
          description: The three-letter ISO 4217 currency code.
          example: USD
        description:
          type: string
          description: The description supplied when the payment was created.
          example: Order A-1234
        failureReason:
          type: string
          description: "Why the payment failed, when `status` is `failed`. Absent otherwise — this is the acquirer's reason, not a validation message."
          example: card_declined
        id:
          type: string
          format: uuid
          description: Unique identifier for this payment.
        merchantId:
          type: string
          format: uuid
          description: The merchant this payment belongs to — always your own account.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: "Up to 20 arbitrary key-value pairs you can attach to this object. PaymentFlow never interprets them; they are returned on every read and are filterable with `metadata[key]=value`."
        mode:
          type: string
          description: "Whether this payment is `test` or `live` data. Determined by the API key that created it and not changeable by any header, parameter or field."
          enum:
          - test
          - live
          example: test
        object:
          type: string
          description: Always `payment`. The discriminator that identifies this object out of context.
          example: payment
        paymentMethodToken:
          type: string
          description: "The payment-method token this payment authorizes against, if one was supplied."
          example: tok_visa_approved
        refundedAmountMinor:
          type: integer
          format: int64
          description: "How much has been refunded so far, in minor units. Never exceeds `capturedAmountMinor`."
          example: 0
        refunds:
          type: array
          description: "The refunds issued against this payment. **Present only when you ask for it** with `?expand=refunds`, and omitted entirely otherwise rather than returned empty — an empty list would be indistinguishable from \"this payment has no refunds\"."
          items:
            $ref: "#/components/schemas/RefundResponse"
        status:
          type: string
          description: "Where this payment is in its lifecycle. Lowercase `snake_case` as of API revision `2026-08-01`; callers pinned to `2026-07-27` receive the older upper-case spelling. **New values may be added without a new revision**, so treat an unrecognised status as one you do not handle rather than as an error."
          example: authorized
        updatedAt:
          type: string
          format: date-time
          description: "When the payment last changed, as RFC 3339."
    RefundRequest:
      type: object
      properties:
        amountMinor:
          type: integer
          format: int64
          description: "How much to refund, in the currency's minor unit. Omit it — or send no body at all — to refund everything that remains captured."
          example: 1000
        metadata:
          type: object
          additionalProperties:
            type: string
          description: "Up to 20 arbitrary key-value pairs you can attach to this object. PaymentFlow never interprets them; they are returned on every read and are filterable with `metadata[key]=value`."
        reason:
          type: string
          description: "Why the refund was issued, up to 500 characters. For your own records; PaymentFlow never interprets it."
          example: Customer returned the item
          maxLength: 500
          minLength: 0
    RefundResponse:
      type: object
      properties:
        amountMinor:
          type: integer
          format: int64
          description: "The amount refunded, in the currency's minor unit."
