  /v1/balance_transactions:
    get:
      description: |-
        Returns the individual ledger entries behind your balance, most recent first, cursor-paginated. Every entry names the payment and the lifecycle event that produced it, so a balance can always be reconciled back to the payments that made it.

        Only your own side of each entry is returned. Every posting is balanced against the platform's clearing account, which is not a merchant's business to see — this is a projection of the ledger, not a dump of it.
      operationId: listBalanceTransactions
      parameters:
      - description: "How many objects to return, 1–100. Values above the ceiling are clamped to it rather than rejected, so a client asking for more simply receives the maximum. Defaults to 25."
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      - description: A cursor for pagination. Pass the `nextCursor` from the previous response to fetch the following page. The value is opaque and signed — treat it as a token and never parse or construct one.
        in: query
        name: starting_after
        required: false
        schema:
          type: string
      - description: "Return only objects created at or after this instant, as RFC 3339 (`2026-07-29T00:00:00Z`)."
        in: query
        name: created_after
        required: false
        schema:
          type: string
          format: date-time
      - description: "Return only objects created at or before this instant, as RFC 3339 (`2026-07-29T23:59:59Z`)."
        in: query
        name: created_before
        required: false
        schema:
          type: string
          format: date-time
      - description: "Pin this one request to a dated API revision. Overrides the revision your account is pinned to; omit it to use that pin, or the current revision if you have none. An unrecognised value is rejected with `400 UNSUPPORTED_API_VERSION` rather than silently ignored."
        in: header
        name: PaymentFlow-Version
        required: false
        schema:
          type: string
          example: 2026-08-01
      - description: "Your own identifier for this operation, echoed back on the response and recorded on every log line it produces. Send one to join your logs to PaymentFlow's; omit it and one is generated for you."
        in: header
        name: X-Correlation-Id
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageBalanceTransactionResponse"
          description: "A page of ledger entries, most recent first."
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Link:
              $ref: "#/components/headers/Link"
            PaymentFlow-Version:
              $ref: "#/components/headers/PaymentFlow-Version"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Sunset:
              $ref: "#/components/headers/Sunset"
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "The query could not be understood: a tampered or malformed `starting_after` cursor, a `limit` that is not positive, or a filter value outside the vocabulary this endpoint accepts. A rejected filter is deliberately an error rather than an empty page — an empty page is something you would then have to explain to yourself."
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Link:
              $ref: "#/components/headers/Link"
            PaymentFlow-Version:
              $ref: "#/components/headers/PaymentFlow-Version"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Sunset:
              $ref: "#/components/headers/Sunset"
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
        "401":
