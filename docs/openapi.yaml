tags:
- description: "Create, authorize, capture, void, and read payments."
  name: Payments
- description: Read the refunds issued against your payments.
  name: Refunds
- description: "Your available and pending balance, per currency."
  name: Balance
- description: The ledger entries that make up your balance.
  name: Balance transactions
- description: "The log of everything that happened on your account, and the source of every webhook you receive."
  name: Events
- description: "Payment volume, success rate, and totals over a time range."
  name: Analytics
- description: "Every API request your keys made, with status and timing."
  name: Request logs
- description: "Your metered request counts, aggregated per UTC day."
  name: Usage
- description: Register and manage the URLs PaymentFlow sends events to.
  name: Webhook endpoints
- description: Inspect and replay individual webhook delivery attempts.
  name: Webhook deliveries
- description: The card tokens that drive each sandbox outcome. Public reference data — no API key required.
  name: Test cards
- description: "Force the next authorization to a chosen outcome, for testing failure paths on demand."
  name: Simulations
- description: Why the sandbox decided each authorization the way it did.
  name: Decisions
components:
  schemas:
    AnalyticsBucketResponse:
      type: object
      properties:
        authorizedCount:
          type: integer
          format: int64
        bucketStart:
          type: string
          format: date-time
        capturedCount:
          type: integer
          format: int64
        createdCount:
          type: integer
          format: int64
        currency:
          type: string
        failedCount:
          type: integer
          format: int64
        object:
          type: string
        refundedCount:
          type: integer
          format: int64
        totalCapturedAmountMinor:
          type: integer
          format: int64
        totalRefundedAmountMinor:
          type: integer
          format: int64
        voidedCount:
          type: integer
          format: int64
    AnalyticsSummaryResponse:
      type: object
      properties:
        authorizedCount:
          type: integer
          format: int64
        buckets:
          type: array
