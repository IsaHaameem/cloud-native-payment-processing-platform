    get:
      description: |-
        Returns how much of the API you used over a date range, broken down by day, key and route, with latency percentiles per bucket.

        Dated rather than timestamped, because the aggregate is per UTC day — accepting an instant would imply a precision the stored data does not have. Usage is grouped by key, so two keys hitting the same route on the same day appear as two buckets rather than one merged number; percentiles cannot be meaningfully averaged across keys, which is why they are not.

        This outlives the raw request log: entries there are pruned, and their counts are rolled forward into these aggregates first.
