          - string
          - "null"
          description: "Which part of the platform acts on this scenario. **`null` means the decision engine enforces it now**; a value names the release that will. The webhook scenarios are stored and validated but not yet acted on, and saying so here is more honest than accepting an override that silently does nothing."
          example: M18
        errorCode:
          type:
          - string
          - "null"
          description: "The error code being returned, for an error scenario. **Null** otherwise."
          example: processor_unavailable
        expiresAt:
          type:
          - string
          - "null"
          format: date-time
          description: When the override stops applying. **Null** for a count-bounded override.
        id:
          type: string
          format: uuid
          description: Unique identifier for this override.
        latencyMs:
          type:
          - integer
          - "null"
          format: int32
          description: "The latency being injected, in milliseconds. **Null** for a scenario that injects none."
          example: 3000
        remainingCount:
          type:
          - integer
          - "null"
          format: int32
          description: How many authorizations the override still applies to. Counts down as it is used; **null** for a time-bounded override.
          example: 2
        scenario:
          type: string
          description: The behaviour being forced.
          example: FORCE_DECLINE
    TestCardResponse:
      type: object
      properties:
        brand:
          type: string
          description: The card brand this token simulates.
          example: visa
        captureBehaviour:
          type: string
          description: "What a later capture against this token will do — succeed immediately, fail, or settle after a delay. Authorization and capture can behave differently on purpose: a card that authorizes cleanly and then fails to capture is a real and easily-missed case."
          example: IMMEDIATE
        declineCode:
          type:
          - string
          - "null"
          description: "The decline code the authorization will carry, when `outcome` is a decline. **Null** otherwise."
          example: insufficient_funds
        deferredDelayMs:
          type:
          - integer
          - "null"
          format: int32
          description: "How long a deferred capture or refund waits before its outcome arrives, in milliseconds. **Null** on the tokens whose behaviour is immediate; where it is set, the result reaches you as a webhook, exactly as an asynchronous settlement would."
          example: 5000
        description:
          type: string
          description: "What this token is for, in one line."
          example: Always approves; captures and refunds immediately.
        errorCode:
          type:
          - string
          - "null"
          description: "The error code the authorization will fail with, when `outcome` is an error. **Null** otherwise."
          example: processor_unavailable
        latencyMs:
          type: integer
          format: int32
          description: "How long the simulated acquirer will take to answer, in milliseconds. Non-zero on the tokens that exist to let you exercise timeouts deliberately rather than by waiting for a bad day."
          example: 0
        outcome:
          type: string
          description: "What authorizing against this token does: approve, decline, or fail with an error. A decline is the acquirer saying no and is a normal outcome your integration must handle; an error is the acquirer being unreachable or broken."
          example: APPROVE
        refundBehaviour:
          type: string
          description: What a later refund against this token will do.
          example: IMMEDIATE
        token:
          type: string
          description: The token to pass as `paymentMethodToken` when creating a payment. This is what selects the behaviour described by the rest of this object.
          example: tok_visa_approved
    UpdateWebhookEndpointRequest:
      type: object
      properties:
        description:
          type: string
          description: A new label for this endpoint. Omit to leave it unchanged.
          example: Production order pipeline
          maxLength: 255
          minLength: 0
        enabled:
          type: boolean
          description: "Turn deliveries on or off. Re-enabling an endpoint the platform disabled resets its failure count — fix the receiver first, or it will simply be disabled again."
        enabledEvents:
          type: array
          description: "Replace the subscription list. Sent wholesale rather than merged, so this is the complete new list. Omit to leave it unchanged."
          example:
          - payment.captured
          items:
            type: string
            maxLength: 64
            minLength: 0
        metadata:
          type: object
          additionalProperties:
            type: string
          description: "Replace the metadata. A supplied map replaces the stored one wholesale rather than merging, so `{}` clears it — a merge would leave no way to remove a key. Omit to leave it unchanged."
    UsageBucketResponse:
      type: object
      properties:
        clientErrors:
          type: integer
          format: int64
          description: How many returned a 4xx.
          example: 11
        day:
          type: string
          format: date
          description: "The day this bucket covers, in UTC."
          example: 2026-07-29
        keyId:
          type:
          - string
          - "null"
          format: uuid
          description: "The API key the traffic was made with. Usage is grouped by key, so two keys hitting the same route on the same day produce two buckets. **Null** for traffic made with a key that has since been deleted — the usage is still a fact about your day."
        maxDurationMs:
          type: integer
          format: int64
          description: "The slowest single request in the bucket, in milliseconds."
          example: 812
        meanDurationMs:
          type:
          - integer
          - "null"
          format: int64
          description: Mean server-side duration in milliseconds. Null when the bucket had no traffic.
          example: 42
        p50DurationMs:
          type:
          - integer
          - "null"
          format: int64
          description: Median server-side duration in milliseconds. Null when the bucket had no traffic.
          example: 31
        p95DurationMs:
          type:
          - integer
          - "null"
          format: int64
          description: "95th-percentile server-side duration in milliseconds. **Explicitly null**, never omitted, when the bucket had no traffic: a percentile over zero requests is unknown rather than zero."
          example: 118
        p99DurationMs:
          type:
          - integer
          - "null"
          format: int64
          description: 99th-percentile server-side duration in milliseconds. Null when the bucket had no traffic.
          example: 260
        requests:
          type: integer
          format: int64
          description: How many requests fell in this bucket.
          example: 4820
        route:
          type: string
          description: "The route pattern the requests hit, not the concrete path — so every payment retrieval aggregates together."
          example: "/v1/payments/{id}"
        serverErrors:
          type: integer
          format: int64
          description: How many returned a 5xx.
          example: 0
    UsageSummaryResponse:
      type: object
      properties:
        buckets:
          type: array
          description: "The breakdown behind the totals, one bucket per day, key and route."
          items:
            $ref: "#/components/schemas/UsageBucketResponse"
        from:
          type: string
          format: date
          description: "The first day these totals cover, inclusive."
          example: 2026-07-01
        to:
          type: string
          format: date
          description: "The last day these totals cover, inclusive."
          example: 2026-07-29
        totalClientErrors:
          type: integer
          format: int64
          description: How many of those returned a 4xx — your requests that were rejected.
          example: 312
        totalRequests:
          type: integer
          format: int64
          description: How many API requests you made across the range.
          example: 148203
        totalServerErrors:
          type: integer
          format: int64
          description: "How many returned a 5xx — this platform's failures, not yours."
          example: 4
    WebhookDeliveryAttemptResponse:
      type: object
      properties:
        attemptNumber:
          type: integer
          format: int32
          description: "Which attempt this was, starting at 1."
          example: 1
        attemptedAt:
          type: string
          format: date-time
          description: "When the attempt was made, as RFC 3339."
        durationMs:
          type: integer
          format: int32
          description: "How long the attempt took, in milliseconds."
          example: 128
        error:
          type: string
          description: "Why the attempt failed before it got a response — a DNS failure, a refused connection, a timeout, or an address the egress guard blocked. Absent when the receiver answered at all, even with an error status."
        id:
          type: string
          format: uuid
          description: Unique identifier for this attempt.
        outcome:
          type: string
          description: "What happened: the receiver accepted it, rejected it, or was never reached."
          enum:
          - SUCCEEDED
          - FAILED_STATUS
          - FAILED_TRANSPORT
          - BLOCKED
          example: SUCCESS
        requestBody:
          type: string
          description: The body sent — byte for byte what the signature was computed over.
        requestHeaders:
          type: string
          description: "The headers sent, **including the `PaymentFlow-Signature`** this platform computed. That is deliberate and safe — a signature is not a secret, and comparing the value sent against the one you computed is how a verification failure gets diagnosed. The signing secret itself never appears here."
        requestUrl:
          type: string
          description: The URL this attempt was sent to.
          example: https://example.com/webhooks/paymentflow
        responseBody:
          type: string
          description: "The body the receiver returned, truncated. Often the only explanation of a rejection."
        responseHeaders:
          type: string
          description: The headers the receiver returned.
        responseStatus:
          type: integer
          format: int32
          description: The HTTP status the receiver returned. Absent when it was never reached.
          example: 200
    WebhookDeliveryResponse:
      type: object
      properties:
        attemptCount:
          type: integer
          format: int32
          description: How many attempts have been made so far.
          example: 1
        attempts:
          type: array
          description: "Every attempt, with the request sent and the response received. This is the point of the delivery log: the answer a merchant needs is almost never \"failed\", it is \"failed with 502 and this body, four times\"."
          items:
            $ref: "#/components/schemas/WebhookDeliveryAttemptResponse"
        createdAt:
          type: string
          format: date-time
          description: "When the delivery was created, as RFC 3339."
        endpointId:
          type: string
          format: uuid
          description: The endpoint this delivery is addressed to.
        eventId:
          type: string
          description: "The event being delivered. The same `evt_` id you can read back at `/v1/events`, so a delivery can always be traced to what caused it."
          example: evt_9f2c1e7a4b8d4c3e8a1d2b4f6a8c05d1
        eventType:
          type: string
          description: The type of the event being delivered.
          example: payment.captured
        id:
          type: string
          format: uuid
          description: Unique identifier for this delivery.
        lastAttemptedAt:
          type: string
          format: date-time
          description: When it was last attempted. Absent if it has not been attempted yet.
        nextAttemptAt:
          type: string
          format: date-time
          description: When the next retry is scheduled. Absent once the delivery has succeeded or been dead-lettered.
        object:
          type: string
          description: Always `webhook_delivery`.
          example: webhook_delivery
        replayedFromDeliveryId:
          type: string
          format: uuid
          description: "The delivery this one re-sends, when it was created by a replay. Absent on an original delivery."
        status:
          type: string
          description: "Where the delivery stands: still pending, delivered, retrying, or dead-lettered after exhausting the retry schedule."
          enum:
          - PENDING
          - DELIVERED
          - DEAD_LETTERED
          example: DELIVERED
        url:
          type: string
          description: "The URL it is being sent to, as it was when the delivery was created."
          example: https://example.com/webhooks/paymentflow
    WebhookEndpointCreatedResponse:
      type: object
      properties:
        endpoint:
          $ref: "#/components/schemas/WebhookEndpointResponse"
          description: "The endpoint, in the shape every other read returns it in."
        signingSecret:
          type: string
          description: "The signing secret, in full. **Shown exactly once — store it now.** Every delivery to this endpoint is signed with it, and verifying that signature is the only thing standing between your receiver and anyone who learns its URL. It cannot be retrieved afterwards: only a hash is kept, so the platform genuinely cannot show it again rather than merely declining to. Lost one is replaced by rotating, not by recovering."
          example: whsec_9f2c1e7a4b8d4c3e8a1d2b4f6a8c05d1
    WebhookEndpointResponse:
      type: object
      properties:
        apiVersion:
          type: string
          description: The API revision delivery bodies are rendered in for this endpoint.
          example: 2026-08-01
        consecutiveFailureCount:
          type: integer
          format: int32
          description: How many deliveries have failed in a row. Resets to zero on the first success. When it reaches the platform's threshold the endpoint is disabled automatically — a permanently broken receiver is not retried forever.
          example: 0
        createdAt:
          type: string
          format: date-time
          description: "When the endpoint was registered, as RFC 3339."
        description:
          type: string
          description: Your own label for this endpoint.
          example: Production order pipeline
        disabledAt:
          type: string
          format: date-time
          description: "When the endpoint was disabled, if it is."
        disabledReason:
          type: string
          description: Why the endpoint was disabled. **This is how you tell "the platform turned this off because it kept failing" from "I turned this off"** — which decides whether re-enabling it requires fixing something first. Absent on an enabled endpoint.
          enum:
          - CONSECUTIVE_FAILURES
        enabled:
          type: boolean
          description: Whether deliveries are currently being sent. May be false because you disabled it or because the platform did — see `disabledReason`.
        enabledEvents:
          type: array
          description: "The event types this endpoint receives. `*` means every type, including ones added later."
          example:
          - payment.captured
          - payment.refunded
          items:
            type: string
        id:
          type: string
          format: uuid
          description: Unique identifier for this endpoint.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: "Up to 20 arbitrary key-value pairs you can attach to this object. PaymentFlow never interprets them; they are returned on every read and are filterable with `metadata[key]=value`."
        migratedFromLegacy:
          type: boolean
          description: Whether this endpoint was carried over from the platform's pre-webhook-product configuration.
        object:
          type: string
          description: Always `webhook_endpoint`.
          example: webhook_endpoint
        signingSecretPrefix:
          type: string
          description: "The first few characters of the signing secret, so you can tell which secret an endpoint holds. **The full secret is shown exactly once**, when the endpoint is created or its secret is rotated, and is not retrievable afterwards."
          example: whsec_9f2c
        updatedAt:
          type: string
          format: date-time
          description: "When the endpoint last changed, as RFC 3339."
        url:
          type: string
          description: "Where deliveries are sent. Not updatable: the URL is half of an endpoint's identity, and repointing one would leave its delivery history attached to a destination that never received any of it. Register a new endpoint instead."
          example: https://example.com/webhooks/paymentflow
  securitySchemes:
    SecretKey:
      bearerFormat: sk
      description: |-
        Your secret API key, sent as `Authorization: Bearer sk_test_...`.

        The key determines both *whose* data you see and *which mode* you see it in: an `sk_test_` key reads and writes test data only, an `sk_live_` key live data only. No header, parameter, or body field can change either — to work in the other mode, use the other key.
      scheme: bearer
      type: http
