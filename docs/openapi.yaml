  /v1/request_logs:
    get:
      description: |-
        Returns the API calls you have made, most recent first, cursor-paginated — the record you reach for when an integration behaved differently from how you expected.

        Each entry carries the `requestId` the response returned, so an error a customer reported can be found here by the identifier they quote. Bodies and headers are **redacted at the edge before they are stored**: card numbers, API keys and secrets never reach this log, so what you see here is what was safe to keep rather than what was sent.

        Entries are pruned on a schedule; older traffic survives as aggregates at `/v1/usage`.
      operationId: listRequestLogs
      parameters:
      - description: "How many objects to return, 1–100. Values above the ceiling are clamped to it rather than rejected, so a client asking for more simply receives the maximum. Defaults to 25."
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      - description: A cursor for pagination. Pass the `nextCursor` from the previous response to fetch the following page. The value is opaque and signed — treat it as a token and never parse or construct one.
        in: query
        name: starting_after
        required: false
        schema:
          type: string
      - description: "Return only objects created at or after this instant, as RFC 3339 (`2026-07-29T00:00:00Z`)."
        in: query
        name: created_after
        required: false
        schema:
          type: string
          format: date-time
      - description: "Return only objects created at or before this instant, as RFC 3339 (`2026-07-29T23:59:59Z`)."
        in: query
        name: created_before
        required: false
        schema:
          type: string
          format: date-time
      - description: Return only requests that returned this exact HTTP status.
        example: 409
        in: query
        name: status_code
        required: false
        schema:
          type: integer
          format: int32
      - description: Return only requests made with this HTTP method.
        example: POST
        in: query
        name: method
        required: false
        schema:
          type: string
      - description: "Pin this one request to a dated API revision. Overrides the revision your account is pinned to; omit it to use that pin, or the current revision if you have none. An unrecognised value is rejected with `400 UNSUPPORTED_API_VERSION` rather than silently ignored."
        in: header
