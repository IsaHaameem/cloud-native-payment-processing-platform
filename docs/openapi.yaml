        createdAt:
          type: string
          format: date-time
          description: "When the refund was created, as RFC 3339."
        currency:
          type: string
          description: "The three-letter ISO 4217 currency code, matching the payment's."
          example: USD
        failureReason:
          type: string
          description: "Why the refund failed, when `status` is `failed`. Absent otherwise."
        id:
          type: string
          format: uuid
          description: Unique identifier for this refund.
        merchantId:
          type: string
          format: uuid
          description: The merchant this refund belongs to — always your own account.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: "Up to 20 arbitrary key-value pairs you can attach to this object. PaymentFlow never interprets them; they are returned on every read and are filterable with `metadata[key]=value`."
        mode:
          type: string
          description: Whether this refund is `test` or `live` data. Inherited from the payment.
          enum:
          - test
          - live
          example: test
        object:
          type: string
          description: Always `refund`. The discriminator that identifies this object out of context.
          example: refund
        paymentId:
          type: string
          format: uuid
          description: The payment this refund was issued against.
        reason:
          type: string
          description: "The reason supplied when the refund was issued, if any."
          example: Customer returned the item
        status:
          type: string
          description: Where this refund is in its lifecycle. Lowercase `snake_case` as of API revision `2026-08-01`. New values may be added without a new revision.
          example: succeeded
        updatedAt:
          type: string
          format: date-time
          description: "When the refund last changed, as RFC 3339."
