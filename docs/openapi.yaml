components:
  headers:
    Deprecation:
      description: "`true` when the revision that answered has been superseded. Sent per RFC 8594 as the flag form rather than a date, because the moment a revision became deprecated for you is not something this platform records per merchant. Absent on the current revision."
      required: false
      schema:
        type: string
        example: "true"
    Link:
      description: "An RFC 8288 link to the versioning documentation, with `rel=\"deprecation\"`. What makes `Deprecation` actionable rather than merely alarming; absent on the current revision."
      required: false
      schema:
        type: string
        example: <https://docs.paymentflow.dev/versioning>; rel="deprecation"
    PaymentFlow-Version:
      description: "The dated API revision that answered this request, resolved as request header, then your pinned revision, then the current one. Always present on a response that reached the API rather than being refused at the edge."
      required: false
      schema:
        type: string
        example: 2026-08-01
    RateLimit-Limit:
      description: "Your daily request quota for this mode. Present on responses to API-key traffic once the request has been measured against its allowance; absent on a response refused before that point, and on unauthenticated traffic, which is limited by address instead."
      required: false
      schema:
        type: integer
        format: int64
    RateLimit-Remaining:
      description: "How many requests remain in the current quota window. Present on responses to API-key traffic once the request has been measured against its allowance; absent on a response refused before that point, and on unauthenticated traffic, which is limited by address instead."
      required: false
      schema:
        type: integer
        format: int64
    RateLimit-Reset:
      description: "Seconds until the quota window resets, at 00:00 UTC. Describes the daily quota rather than the per-second burst bucket: the bucket's reset is always under a second away and would be worthless to plan against. Present on responses to API-key traffic once the request has been measured against its allowance; absent on a response refused before that point, and on unauthenticated traffic, which is limited by address instead."
      required: false
      schema:
        type: integer
        format: int64
    Retry-After:
      description: "Seconds to wait before retrying. **Prefer this over any backoff you compute** — it is the interval the platform will actually accept the request again, and for an exhausted daily quota it is the time remaining until 00:00 UTC rather than a few seconds. Branch on the error `code` to tell the two causes apart: `RATE_LIMIT_EXCEEDED` clears in seconds, `DAILY_QUOTA_EXCEEDED` at the end of the day."
      required: false
      schema:
        type: integer
        format: int64
    Sunset:
      description: The RFC 9110 date after which the superseded revision stops being served. Accompanies `Deprecation`; absent on the current revision.
      required: false
      schema:
        type: string
        example: "Sun, 01 Aug 2027 00:00:00 GMT"
    X-Correlation-Id:
      description: "Identifies the whole distributed trace this call belongs to. Echoed from your request when you send one and generated when you do not, so a client can correlate its own logs with PaymentFlow's. This is the value to quote in a support request when the response carried no body to read `requestId` from."
      required: false
      schema:
        type: string
        format: uuid
  schemas:
    AnalyticsBucketResponse:
      type: object
      properties:
        authorizedCount:
          type: integer
          format: int64
          description: Payments authorized in this hour.
          example: 58
        bucketStart:
          type: string
          format: date-time
          description: The inclusive start of this bucket. Each bucket covers the hour beginning here.
        capturedCount:
          type: integer
          format: int64
          description: Payments captured in this hour.
          example: 57
        createdCount:
          type: integer
          format: int64
          description: Payments created in this hour.
          example: 62
        currency:
          type: string
          description: "The ISO 4217 currency these counts and amounts are for. Buckets are split by currency, so amounts are never mixed."
          example: USD
        failedCount:
          type: integer
          format: int64
          description: Authorization attempts that failed in this hour.
          example: 4
        object:
          type: string
          description: Always `analytics_bucket`.
          example: analytics_bucket
        refundedCount:
          type: integer
          format: int64
          description: Payments refunded in this hour.
          example: 2
        totalCapturedAmountMinor:
          type: integer
          format: int64
          description: "Total captured in this hour, in the bucket's currency's minor unit."
          example: 57000
        totalRefundedAmountMinor:
          type: integer
          format: int64
          description: "Total refunded in this hour, in the bucket's currency's minor unit."
          example: 2000
        voidedCount:
          type: integer
          format: int64
          description: Authorizations released without capture in this hour.
          example: 1
    AnalyticsSummaryResponse:
      type: object
      properties:
        authorizedCount:
          type: integer
          format: int64
          description: How many payments were authorized.
          example: 1310
        buckets:
          type: array
          description: "The hourly series behind these totals, split by currency. The series begins where this platform started recording it."
          items:
            $ref: "#/components/schemas/AnalyticsBucketResponse"
        capturedCount:
          type: integer
          format: int64
          description: How many payments were captured.
          example: 1298
        createdCount:
          type: integer
          format: int64
          description: How many payments were created in the window.
          example: 1420
        failedCount:
          type: integer
          format: int64
          description: How many authorization attempts failed.
          example: 110
        from:
          type: string
          format: date-time
          description: "The start of the window these totals cover, inclusive."
        object:
          type: string
          description: Always `analytics_summary`.
          example: analytics_summary
        refundedCount:
          type: integer
          format: int64
          description: "How many payments were refunded, in whole or in part."
          example: 37
        successRate:
          type:
          - number
          - "null"
          format: double
          description: |-
            The share of authorization attempts that succeeded, between 0 and 1, computed as `authorizedCount / (authorizedCount + failedCount)`. Payments still in `created` are excluded — they have not been attempted, and counting them as failures would make the rate fall simply because traffic arrived.

            **Explicitly `null`**, never omitted, when nothing was attempted in the window: a rate over zero attempts is unknown rather than zero.
          example: 0.9225
        to:
          type: string
          format: date-time
          description: "The end of the window these totals cover, inclusive."
        totalCapturedAmountMinor:
          type: integer
          format: int64
          description: "Total captured across the window, in minor units. Not currency-split — use `buckets` for that."
          example: 1298000
        totalRefundedAmountMinor:
          type: integer
          format: int64
          description: "Total refunded across the window, in minor units."
          example: 37000
        voidedCount:
          type: integer
          format: int64
          description: How many authorizations were released without capture.
          example: 12
    ApiError:
      type: object
      properties:
        code:
          type: string
          description: "A stable, machine-readable identifier for this specific failure, such as `PAYMENT_NOT_CAPTURABLE`. The set of codes grows by policy, which is why `type` and not this is what a client should switch on. Every code is catalogued in docs/ERRORS.md."
        correlationId:
          type: string
          description: "Identifies the whole distributed trace this call belongs to, which may span several services. Broader than `requestId`."
        docUrl:
          type: string
          description: Where to read about this specific code.
        errors:
          type: array
          description: "Field-level validation failures, when the request failed validation in more than one place."
          items:
            $ref: "#/components/schemas/ApiFieldError"
        message:
          type: string
          description: "A human-readable explanation. Safe to log; not intended to be shown to your customers, and never programmatically parsed."
        param:
          type: string
          description: "The single offending parameter, when there is exactly one. Multi-field validation failures use `errors` instead."
        path:
          type: string
          description: The request path that produced the error.
        requestId:
          type: string
          description: Identifies this one HTTP call. **Quote this in a support request** — it is on every log line and every row of your request log.
        status:
          type: integer
          format: int32
          description: "The HTTP status code, repeated in the body so a logged response is self-contained."
        timestamp:
          type: string
          format: date-time
          description: "When the error occurred, as RFC 3339."
        type:
          type: string
          description: "The error's classification, and **the field to branch on**. This is a small closed set an SDK maps to exception classes: `authentication_error`, `permission_error`, `invalid_request_error`, `idempotency_error`, `rate_limit_error`, `api_error`."
          enum:
          - authentication_error
          - permission_error
          - invalid_request_error
          - idempotency_error
          - rate_limit_error
          - api_error
    ApiFieldError:
      type: object
      properties:
        field:
          type: string
          description: The request field that failed validation.
        message:
          type: string
          description: Why it failed. The rejected value is deliberately never echoed back.
    BalanceResponse:
      type: object
      properties:
        balances:
          type: array
          description: One entry per currency you hold a balance in. A currency you have never transacted in is absent rather than reported as zero.
          items:
            $ref: "#/components/schemas/CurrencyBalance"
        object:
          type: string
          description: Always `balance`. The discriminator that identifies this object out of context.
          example: balance
    BalanceTransactionResponse:
      type: object
      properties:
        accountType:
          type: string
          description: Which of your accounts moved. `MERCHANT_PENDING` holds authorized funds; `MERCHANT_SETTLED` holds captured funds owed to you. The other leg of every entry touches the platform's clearing account and is deliberately not exposed.
          example: MERCHANT_SETTLED
        amountMinor:
          type: integer
          format: int64
          description: "The amount moved, in the currency's minor unit. Always positive — `direction` carries the sign."
          example: 1000
        createdAt:
          type: string
          format: date-time
          description: "When the entry was posted, as RFC 3339."
        currency:
          type: string
          description: The three-letter ISO 4217 currency code.
          example: USD
        direction:
          type: string
          description: Whether the entry added to (`CREDIT`) or removed from (`DEBIT`) the account.
          enum:
          - DEBIT
          - CREDIT
          example: CREDIT
        eventType:
          type: string
          description: "Which payment lifecycle event produced the entry — an authorization, a capture, a refund, a void. This is the *why* of the movement."
          example: payment.captured
        id:
          type: string
          format: uuid
          description: Unique identifier for this ledger entry.
        mode:
          type: string
          description: Whether this entry is `test` or `live` data.
          enum:
          - test
          - live
          example: test
        object:
          type: string
          description: Always `balance_transaction`. The discriminator that identifies this object out of context.
          example: balance_transaction
        paymentId:
          type: string
          format: uuid
          description: The payment whose lifecycle produced this entry.
    CreatePaymentRequest:
      type: object
      properties:
        amountMinor:
          type: integer
          format: int64
          description: "The amount to charge, as an integer in the currency's **minor unit**: `1000` in `USD` is $10.00. There are no floating-point amounts anywhere in this API. Must be positive."
          example: 1000
        currency:
          type: string
          description: "The three-letter ISO 4217 currency code, such as `USD`."
          example: USD
          maxLength: 3
          minLength: 3
        description:
          type: string
          description: "An arbitrary description of what is being paid for, up to 500 characters. For your own records — PaymentFlow never shows it to your customer."
          example: Order A-1234
          maxLength: 500
          minLength: 0
        metadata:
          type: object
          additionalProperties:
            type: string
          description: "Up to 20 arbitrary key-value pairs you can attach to this object. PaymentFlow never interprets them; they are returned on every read and are filterable with `metadata[key]=value`."
        paymentMethodToken:
          type: string
          description: "A payment-method token to authorize against. Optional: a payment created without one takes the mode's default authorization behaviour. In test mode, pass one of the tokens from `GET /v1/test/cards` to choose the outcome."
          example: tok_visa_approved
          maxLength: 64
          minLength: 0
      required:
      - currency
    CreateSimulationOverrideRequest:
      type: object
      properties:
        declineCode:
          type: string
          description: "The decline code to return. Required for `FORCE_DECLINE`, ignored otherwise."
          example: insufficient_funds
          maxLength: 48
          minLength: 0
        durationSeconds:
          type: integer
          format: int32
          description: "How long the override lasts, in seconds. The alternative to `remainingCount`; supply one of the two."
          example: 300
        errorCode:
          type: string
          description: "The error code to fail with. Required for `FORCE_ERROR`, ignored otherwise."
          example: processor_unavailable
          maxLength: 48
          minLength: 0
        latencyMs:
          type: integer
          format: int32
          description: "How long to stall, in milliseconds. Required for the latency scenarios, ignored otherwise."
          example: 3000
        remainingCount:
          type: integer
          format: int32
          description: "How many authorizations the override applies to before it expires. **Supply this or `durationSeconds`** — an override with neither would never stop, and a sandbox you cannot get back out of is worse than one you cannot get into."
          example: 3
        scenario:
          type: string
          description: "Which behaviour to force. The scenario decides which of the fields below are required: `FORCE_DECLINE` needs `declineCode`, `FORCE_ERROR` needs `errorCode`, and the latency scenarios need `latencyMs`."
          enum:
          - FORCE_DECLINE
          - FORCE_ERROR
          - INJECT_LATENCY
          - FORCE_TIMEOUT
          - FORCE_RATE_LIMIT
          - DELAY_SETTLEMENT
          - DUPLICATE_WEBHOOKS
          - WEBHOOK_FAILURE
          example: FORCE_DECLINE
      required:
      - scenario
    CreateWebhookEndpointRequest:
      type: object
      properties:
        description:
          type: string
          description: Your own label for this endpoint. Useful once you have more than one.
          example: Production order pipeline
          maxLength: 255
          minLength: 0
        enabledEvents:
          type: array
          description: "The event types to send here. Must name at least one — an endpoint subscribed to nothing looks identical to a broken platform from your side, so it is refused rather than accepted silently. Use `[\"*\"]` to receive everything, including types added later."
          example:
          - payment.captured
          - payment.refunded
          items:
            type: string
            maxLength: 64
            minLength: 0
        metadata:
          type: object
          additionalProperties:
            type: string
          description: "Up to 20 arbitrary key-value pairs you can attach to this object. PaymentFlow never interprets them; they are returned on every read and are filterable with `metadata[key]=value`."
        url:
          type: string
          description: |-
            Where to send deliveries. Must be reachable from the public internet over HTTPS: private, link-local and cloud-metadata addresses are refused, and the address is re-checked at delivery time so a hostname cannot be repointed at one afterwards.

            Not updatable later — the URL is half of an endpoint's identity.
          example: https://example.com/webhooks/paymentflow
          maxLength: 2048
          minLength: 0
      required:
      - enabledEvents
      - url
    CurrencyBalance:
      type: object
      properties:
        availableMinor:
          type: integer
          format: int64
          description: "Money captured and owed to you, in the currency's minor unit, net of refunds."
          example: 125000
        currency:
          type: string
          description: The three-letter ISO 4217 currency code.
          example: USD
        pendingMinor:
          type: integer
          format: int64
          description: "Money authorized but not yet captured, in the currency's minor unit. Not yours yet — an authorization can still be voided or expire."
          example: 0
