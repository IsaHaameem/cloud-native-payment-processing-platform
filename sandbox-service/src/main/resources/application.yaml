spring:
  application:
    name: sandbox-service
  datasource:
    # Local default points at the compose Postgres (host port 55432). Overridden by
    # SPRING_DATASOURCE_* env vars in containers / production.
    url: jdbc:postgresql://localhost:55432/paymentflow
    username: paymentflow
    password: paymentflow
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only validates it.
    open-in-view: false
    properties:
      hibernate:
        default_schema: sandbox
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: sandbox
    default-schema: sandbox
    locations: classpath:db/migration
  kafka:
    # Local default points at the compose Kafka's host-published listener.
    # KafkaProducerConfig builds its own KafkaTemplate<String,String> with explicit
    # StringSerializer instances (mirrors payment-service, M17.6's first producer role
    # for this service) — the scheduled-outcome row is already a fully-serialized JSON
    # EventEnvelope by the time ScheduledOutcomeRelay ships it, same as the payment
    # outbox.
    bootstrap-servers: localhost:59092
    producer:
      acks: all
  mvc:
    async:
      # Comfortably above DecisionEngine.MAX_INJECTABLE_LATENCY_MS (10s) — the
      # decision endpoint's response can be deliberately delayed up to that ceiling
      # (pm_card_slow, inject_latency, force_timeout), and Spring's own async request
      # timeout must never fire before the simulated latency it's timing.
      request-timeout: 15000

server:
  port: 8094

# M21.2 — the OpenAPI description of this service's public surface. The document-level
# metadata (title, contract version, server, the SecretKey scheme) is not here: it is
# shared by every service via common-lib's PublicApiDocument, so the six fragments M21.3
# merges cannot disagree. What is per-service is which paths get published.
springdoc:
  api-docs:
    # OpenAPI 3.1 (§5/M21). springdoc emits a 3.0.1 *document* by default whatever its own
    # version, and 3.1 is what aligns the schemas with JSON Schema 2020-12 — which is the
    # dialect M22's generators and M25's site read.
    version: openapi_3_1
    # The default path, kept explicit because M21.3's merge task and the contract tests
    # both address it by name.
    path: /v3/api-docs
  # The restriction to the public tier. `/api/v1` (the dashboard tier, D98) and
  # `/internal/v1` are not published: §9.5 states that documenting them "would imply a
  # promise the platform does not intend to make" (D148).
  paths-to-match: /v1/**
  # Every response this service produces is JSON. Without this, springdoc infers the media
  # type from each handler's `produces` attribute — absent on every mapping here — and
  # publishes `*/*`, which makes the Accept header an SDK author's guess. Configuration
  # rather than adding `produces` to the mappings, because that attribute also changes
  # *runtime* content negotiation and this is a documentation problem.
  default-produces-media-type: application/json
  # Stable key order, so the committed openapi.yaml baseline and CI's spec-diff (M21.6)
  # see a real change as a real change and reordering as nothing at all.
  writer-with-order-by-keys: true
  # Swagger UI is not on the classpath at all (the -api starter, not -ui); this only makes
  # that explicit for anyone reading the configuration rather than the build file.
  swagger-ui:
    enabled: false

paymentflow:
  simulated-acquirer:
    # D104/M17.7 — deliberately "configurable per environment" (§8.4): small enough
    # that live mode isn't a noisy nuisance for local dev, real enough that live is
    # measurably different from test's deterministic-by-default behaviour.
    decline-rate: 0.03
    error-rate: 0.01
    latency-mean-ms: 120
    latency-std-dev-ms: 40
  scheduled-outcomes:
    # How often ScheduledOutcomeRelay polls for due, undelivered rows (M17.6) — mirrors
    # payment-service's paymentflow.outbox.relay-interval-ms in spirit; 1s keeps the
    # observable delay between a deferred outcome's fireAt and its actual Kafka publish
    # small relative to the shortest deferral this platform simulates (pm_card_
    # delayedSettlement's ~5s).
    relay-interval-ms: 1000
  internal-context:
    # M17.2: payment-service becomes a legitimate *signer* of this header family
    # (D100's mechanism reused for a service-to-service call, not gateway-to-service)
    # to call POST /internal/v1/sandbox/decisions. From M17.5, the gateway signs the
    # same way for the sk_test_-authenticated /v1/test/* control routes.
    secret: ${PAYMENTFLOW_INTERNAL_CONTEXT_SECRET:dev-only-insecure-shared-secret-change-me}
    max-clock-skew-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        # Prometheus (pull-based scrape) is this platform's metrics backend; see
        # every other service's application.yaml for why the OTLP push exporter is
        # disabled here (no receiver configured; Tempo only ingests traces).
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          # Local default points at the compose Tempo. Overridden by
          # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT in containers.
          endpoint: http://localhost:4318/v1/traces

# Correlation/request ids (common-lib's filter) and trace/span ids (Micrometer
# Tracing, M13) surface on every log line.
logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-},requestId=%X{requestId:-},traceId=%X{traceId:-},spanId=%X{spanId:-}]"
