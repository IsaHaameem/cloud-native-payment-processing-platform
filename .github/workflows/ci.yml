#
# CI pipeline (M10, extended by M21.6) — build/test the whole monorepo, gate the
# published API contract, then build (but not yet push) a Docker image for every
# one of the 9 microservices.
#
# Five jobs:
#   1. build-and-test — ./gradlew clean build across all modules. Any test
#      failure fails this job immediately, which skips the others entirely
#      (`needs:` below) — no Docker minutes are spent building images for a
#      broken commit. Since M22.1 this also runs the SDK codegen freshness
#      gate, because `verifySdkSources` is wired into `check`.
#   2. openapi-contract (M21.6) — the two questions about docs/openapi.yaml that
#      `check` deliberately does not ask, because asking them costs six Spring
#      contexts and six Postgres containers: is the committed baseline still what
#      the services serve, and is it still compatible with the copy on the branch
#      being merged into. Its own job rather than two more steps on job 1 so that
#      "the API contract is intact" is a distinct, requireable status check whose
#      failure message is not buried at the bottom of a long build log.
#   3. sdks (M22.1) — one matrix leg per SDK, building and testing each with
#      its own toolchain. Separate from job 1 because neither Node nor Python
#      is a prerequisite for building this monorepo and neither should become
#      one; separate from each other so a Python failure does not hide a Node
#      one.
#   4. developer-portal (M23.1) — the portal is a Node application with its own
#      toolchain, so it gets its own job for the same reason the SDKs do: neither
#      Node nor Next is a prerequisite for building this monorepo. It type-checks,
#      lints, builds, asserts its generated contract is byte-identical to the Node
#      SDK's, and builds its image (never pushed) with the same non-root/port/
#      healthcheck assertions the nine service images get.
#   5. docker-build — one matrix leg per service, each leg building exactly
#      one image via the shared M9 Dockerfile (docker-compose.yml's own
#      SERVICE_MODULE/SERVICE_PORT build args, unchanged). Tagged
#      GHCR-shaped (ghcr.io/<owner>/<service>:latest and :<sha>) but NOT
#      pushed anywhere yet — `push: false` below, deployment/registry
#      publishing is explicitly out of scope for this milestone. Enabling it
#      later needs exactly two changes, both called out at the site: add
#      `packages: write` to `permissions:`, and flip `push: false` to
#      `push: true` alongside the commented-out login step.
#
# Each matrix leg runs on its own isolated GitHub-hosted runner (a separate
# VM per leg, not one shared Docker daemon), so it does not reproduce M9's
# exact "7 concurrent Gradle daemons blow out one Docker Desktop VM's memory"
# failure mode. `max-parallel: 4` still caps how many legs run at once anyway
# (see D58) — the point of M9's lesson (never let unbounded concurrent image
# builds outrun the resources actually available) still applies, just against
# this account's concurrent-job quota instead of local VM memory.
#
# The matrix covers all nine services. It covered eight until M21.6:
# sandbox-service was added to the platform in M17 and to docker-compose.yml,
# but never here.
#
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Superseded runs on the same branch/PR are cancelled automatically instead of
# queuing behind them — avoids burning runner minutes on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # packages: write   # add this when GHCR push is enabled (see docker-build job)

jobs:
  build-and-test:
    name: Build & test (Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # gradle/actions/setup-gradle is the current, actively-maintained way to
      # cache Gradle (dependencies, wrapper distribution, and build-cache
      # entries) in Actions — it supersedes hand-rolling an actions/cache step
      # keyed on hashed lockfiles, and adds a build summary + provenance for
      # free. Deliberately not combined with actions/setup-java's own
      # cache: gradle option, which would just double-cache the same thing.
      - name: Set up Gradle (with dependency/build cache)
        uses: gradle/actions/setup-gradle@v4

      # Pull the images the Testcontainers integration suites use *before* the build,
      # so a transient Docker Hub hiccup or rate-limit surfaces here as a discrete,
      # retriable step rather than as a flaky mid-suite ContainerFetchException that
      # reds the whole run. Versions are kept in lockstep with the tags the tests
      # request (postgres/redis/kafka) — update both together.
      - name: Pre-pull Testcontainers images
        run: |
          docker pull postgres:17-alpine
          docker pull redis:8-alpine
          docker pull confluentinc/cp-kafka:7.7.1

      # --no-build-cache is deliberate and is the point of this step, not a
      # performance oversight. A cached-green build reads identically to a real
      # one: "BUILD SUCCESSFUL" is the same string whether the tests ran or were
      # restored from a previous run's outputs, and that has already misled this
      # repository once — a green `clean build` with 33 tasks served FROM-CACHE
      # sat on top of 18 suites that failed the moment they were actually
      # executed. CI is the one place where the *only* thing being bought is
      # trustworthy signal, so it pays full price for it. Local builds keep the
      # cache; see gradle.properties.
      - name: ./gradlew clean build (cache disabled — CI must really run the tests)
        run: ./gradlew clean build --no-daemon --no-build-cache --stacktrace

      # The other half of the same problem. The step above guarantees the tests
      # were executed; this one guarantees they were executed *everywhere* and
      # that none of them were skipped, by reading the JUnit XML rather than the
      # build's summary line. A module that silently stopped contributing tests —
      # a renamed source set, a filter that matches nothing, a suite excluded by
      # accident — is invisible in "BUILD SUCCESSFUL" and obvious here.
      - name: Prove the tests actually ran
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os, sys, xml.etree.ElementTree as ET

          # The two globs below are cross-checked against each other, so both must
          # reduce to the *same* string for the same module — the module's
          # repo-relative directory. Truncating at the marker rather than walking
          # parents is what guarantees that: `os.path.dirname` on
          # `<module>/src/test/java` yields `<module>/src/test`, which can never
          # match a key derived from a report path, so every module reads as
          # missing however many tests it actually ran. Separators are normalised
          # because glob yields the host's, and the marker is spelled one way.
          def module_of(path, marker):
              return path.replace(os.sep, "/").split(marker)[0]

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          per_module = {}
          for report in glob.glob("**/build/test-results/test/TEST-*.xml", recursive=True):
              module = module_of(report, "/build/test-results/")
              suite = ET.parse(report).getroot()
              counts = per_module.setdefault(module, 0)
              per_module[module] = counts + int(suite.get("tests", 0))
              for key in totals:
                  totals[key] += int(suite.get(key, 0))

          # Every module with test sources must have produced results. Deriving the
          # expectation from the source tree rather than from a hardcoded list means a
          # module added later is covered without anyone remembering to add it here.
          #
          # Recursive since M22.1, which added the first module whose Gradle path is
          # nested (`:sdks:shared`, at sdks/shared). A single-level glob still matched
          # twelve modules and reported no problem, so the gap would have looked exactly
          # like success — the derivation was there precisely so a new module could not be
          # forgotten, and it had quietly stopped covering one.
          missing = [
              module
              for module in (
                  module_of(path, "/src/test/java")
                  for path in glob.glob("**/src/test/java", recursive=True)
              )
              if per_module.get(module, 0) == 0
          ]

          print("### Test execution")
          print(f"- **{totals['tests']} tests** executed across {len(per_module)} modules")
          print(f"- {totals['failures']} failures, {totals['errors']} errors, {totals['skipped']} skipped")
          print("")
          for module in sorted(per_module):
              print(f"  - `{module}` — {per_module[module]}")

          problems = []
          if totals["tests"] == 0:
              problems.append("no tests were executed at all")
          if totals["skipped"]:
              problems.append(f"{totals['skipped']} test(s) were skipped — this repository runs none")
          if missing:
              problems.append("modules with test sources that produced no results: " + ", ".join(missing))
          for problem in problems:
              print(f"::error::{problem}", file=sys.stderr)
          sys.exit(1 if problems else 0)
          PY

      # Runs even if the build/tests failed above, so a failure is always
      # inspectable from the Actions UI without re-running anything locally.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "### Gradle build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────────
  # M21.6 — the OpenAPI contract gate.
  #
  # `/v1` is a promise (invariant 1): breaking it requires a new dated revision
  # and a transformation for the previous one. This job is what makes that a
  # rule rather than an intention. It asks two questions that `check` cannot
  # afford to ask on every local build:
  #
  #   verifyOpenApiBaseline       does docs/openapi.yaml still describe the code?
  #   verifyOpenApiCompatibility  is it still compatible with the base branch's copy?
  #
  # The second is the breaking-change gate proper. It classifies every
  # difference as additive or breaking (OpenApiDiff) and fails only on a
  # *breaking* change that no new API revision declares — so shipping new
  # endpoints, new fields and new enum values stays frictionless, which is the
  # only way a gate like this survives contact with a real roadmap.
  # ──────────────────────────────────────────────────────────────────────────
  openapi-contract:
    name: OpenAPI contract gate
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The gate compares this commit's baseline against the one it is being
          # merged onto, so the history has to be present. The default shallow
          # clone has exactly one commit and `git show <base>:docs/openapi.yaml`
          # would fail on every run.
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (with dependency/build cache)
        uses: gradle/actions/setup-gradle@v4

      # verifyOpenApiBaseline stands up all six public-API services on
      # Testcontainers — the document does not exist until springdoc has scanned
      # a running application context. Same pre-pull rationale as job 1.
      - name: Pre-pull Testcontainers images
        run: |
          docker pull postgres:17-alpine
          docker pull redis:8-alpine
          docker pull confluentinc/cp-kafka:7.7.1

      # The document to compare against: the baseline as it exists on the branch
      # being merged into (pull_request) or before this push (push). A missing or
      # empty file is handled by the gate itself and reported as "nothing to
      # compare against" — which is the correct answer for the commit that first
      # published a baseline, and for a branch whose history does not reach one.
      - name: Resolve the previous published contract
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-parse --verify "HEAD^" 2>/dev/null || echo "")
          fi
          mkdir -p build/openapi
          if [ -n "$base" ] && git cat-file -e "$base:docs/openapi.yaml" 2>/dev/null; then
            git show "$base:docs/openapi.yaml" > build/openapi/previous-openapi.yaml
            echo "Comparing against docs/openapi.yaml at $base"
          else
            : > build/openapi/previous-openapi.yaml
            echo "No previous docs/openapi.yaml reachable — the gate will report nothing to compare."
          fi

      # Cheap (a file comparison, no containers) and the most likely to fail, so
      # it runs first: a developer who broke the contract learns it in seconds
      # rather than after six Spring contexts have started.
      - name: Breaking-change gate
        run: |
          ./gradlew :openapi-tools:verifyOpenApiCompatibility --no-daemon --stacktrace \
            -PopenApiPreviousBaseline="$PWD/build/openapi/previous-openapi.yaml"

      # `if: always()` so one run reports both problems. A stale baseline and a
      # breaking change are independent failures, and finding them one push at a
      # time is how a two-part gate becomes resented.
      - name: Baseline freshness gate
        if: always()
        run: ./gradlew :openapi-tools:verifyOpenApiBaseline --no-daemon --stacktrace

      # §5/M21 task 5: publish the spec as a build artefact. M22's SDK
      # generators and M25's documentation site consume this file, and pulling it
      # from a run rather than from a checkout is how they get the version that
      # was actually verified.
      - name: Upload the published OpenAPI document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: |
            docs/openapi.yaml
            openapi-tools/build/openapi/contract-diff.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "### OpenAPI contract gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f openapi-tools/build/openapi/contract-diff.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat openapi-tools/build/openapi/contract-diff.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # M22.1 — the SDK toolchains.
  #
  # Neither Node nor Python is a prerequisite for building this monorepo: the
  # code generator is Java, it runs in `check`, and a contributor with neither
  # installed can still run `./gradlew build` and have the freshness gate tell
  # them if a generated model is stale (D136's constraint, applied to codegen).
  # What those toolchains are needed for is the other half — that the packages
  # they produce actually type-check, build, and pass their own tests — and
  # that belongs here rather than wired into Gradle.
  #
  # `needs: build-and-test` for the same reason the two jobs above have it:
  # job 1 already ran `verifySdkSources`, so if the generated sources are stale
  # this never starts and the failure is reported once, in the place that
  # explains it.
  #
  # Its own job rather than steps on job 1 so that "the SDKs are healthy" is a
  # distinct, requireable status check — and so that a broken SDK build cannot
  # be mistaken for a broken platform build.
  # ──────────────────────────────────────────────────────────────────────────
  sdks:
    name: SDKs (${{ matrix.sdk }})
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [node, python, java, go]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        if: matrix.sdk == 'node'
        uses: actions/setup-node@v4
        with:
          # 20, not the newest. The package's own floor is 18 (native `fetch`),
          # and building on a runtime far ahead of what integrators run is how a
          # newer API slips into a package that claims to support an older one.
          node-version: "20"
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json

      # `npm ci`, never `npm install`: it installs exactly the committed
      # lockfile and fails if package.json and the lockfile disagree, so a
      # dependency cannot drift in between a developer's machine and this run.
      - name: Install (Node)
        if: matrix.sdk == 'node'
        working-directory: sdks/node
        run: npm ci

      # Type-check, dual ESM/CJS build, then the suite — against `dist/`, which
      # is what an integrator installs. See sdks/node/README.md.
      - name: Verify (Node)
        if: matrix.sdk == 'node'
        working-directory: sdks/node
        run: npm run verify

      - name: Set up Python
        if: matrix.sdk == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install (Python)
        if: matrix.sdk == 'python'
        working-directory: sdks/python
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      # Strict, over the package and its tests. `py.typed` tells a consumer's
      # type checker to trust these annotations; shipping annotations nobody
      # checked would make that marker a false promise.
      - name: Type-check (Python)
        if: matrix.sdk == 'python'
        working-directory: sdks/python
        run: mypy

      # The suite includes tests/test_python_floor.py, which parses every
      # shipped module against the grammar of the oldest Python the package
      # claims to support. mypy cannot check that floor — current mypy refuses
      # to model anything below 3.10 — and it would be the wrong tool anyway:
      # what breaks at a version floor is syntax and runtime API, not types.
      #
      # It also includes tests/test_packaging.py, which builds a wheel and an
      # sdist into a temporary directory, inspects both, and installs the wheel
      # into a clean interpreter to confirm it imports. Nothing publishes: both
      # packages carry a marker their registry refuses, and releasing needs an
      # explicit decision rather than a green build.
      - name: Test (Python)
        if: matrix.sdk == 'python'
        working-directory: sdks/python
        run: pytest

      # ── Java (M26) ──────────────────────────────────────────────────────────
      # Its own standalone Gradle build, not a module of the monorepo (same rule
      # Node and Python follow). Runs on 21; the artifact is Java 17 bytecode via
      # `options.release` in the build file. `build` compiles, tests, builds the
      # javadoc/sources jars, and compiles the examples. ContractParityTest
      # asserts the generated-equivalent layer against sdks/shared/fixtures.
      - name: Set up Java
        if: matrix.sdk == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build (Java)
        if: matrix.sdk == 'java'
        working-directory: sdks/java
        run: ./gradlew --no-daemon build

      - name: Stage the artifact (Java)
        if: matrix.sdk == 'java'
        working-directory: sdks/java
        run: ./gradlew --no-daemon publishToMavenLocal

      # ── Go (M26) ────────────────────────────────────────────────────────────
      # A module inside the monorepo at .../sdks/go, released by a git tag
      # sdks/go/vX.Y.Z. Zero dependencies. parity_test.go asserts the
      # generated-equivalent layer against sdks/shared/fixtures.
      - name: Set up Go
        if: matrix.sdk == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: sdks/go/go.mod

      - name: Build, vet, test, format (Go)
        if: matrix.sdk == 'go'
        working-directory: sdks/go
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...
          go test ./...
          test -z "$(gofmt -l .)" || { echo "gofmt: files need formatting"; gofmt -l .; exit 1; }
          # `go mod tidy` must be a no-op — the module has no dependencies.
          cp go.mod go.mod.orig && go mod tidy && diff go.mod go.mod.orig && rm go.mod.orig

      - name: Summary
        if: always()
        run: |
          echo "### SDK — ${{ matrix.sdk }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published: no. Every SDK is publish-ready; a real release is a tag" >> "$GITHUB_STEP_SUMMARY"
          echo "  \`sdks/<lang>/vX.Y.Z\` plus the deliberate flag flip in sdks/PUBLISHING.md." >> "$GITHUB_STEP_SUMMARY"

  developer-portal:
    name: Developer portal
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned independently of the SDK job, which pins 20 on purpose. Next.js 15
      # needs 20.9+, and sharing one pin between two packages with different
      # floors is the shape of the M22 Node defect: one environment ran the suite
      # and every other version was untested. Two packages, two pins.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: developer-portal/package-lock.json

      # `npm ci`, never `npm install` — same reason as the SDK job: it installs
      # exactly the committed lockfile and fails if it and package.json disagree.
      - name: Install
        working-directory: developer-portal
        run: npm ci

      # Type-check, lint, format check, then a production build. Cheapest first,
      # so a formatting slip does not cost a full Next build to discover.
      - name: Verify
        working-directory: developer-portal
        run: npm run verify

      # The portal's generated tree is committed and its freshness against
      # docs/openapi.yaml is gated by verifySdkSources, in job 1. This asserts the
      # other half: that the portal's copy is byte-identical to the Node SDK's.
      # That is what makes "one reader, three emitters" (D189) true rather than
      # intended — a drift here means the generator produced two different files
      # from one spec, which neither tree's own freshness check could see.
      - name: The portal's generated contract matches the Node SDK's
        run: |
          set -euo pipefail
          for file in contract.ts models.ts operations.ts; do
            diff -u "sdks/node/src/generated/$file" "developer-portal/src/generated/$file"
          done

      # M23.2. `npm run verify` proves the portal compiles, lints and builds; it
      # cannot observe an overlay that opens invisible, a cookie missing HttpOnly,
      # a refresh race that signs a user out, or a token rendered into the HTML.
      # Those are properties of a real browser holding real cookies.
      #
      # Driven through playwright-core against the Chrome preinstalled on the
      # runner, so nothing downloads a browser. The stub platform stands in for
      # the gateway: an expired access token and a revoked refresh token are one
      # line each there, and would need a fifteen-minute wait against the real
      # identity-service.
      #
      # Both suites assert their own instrument first — visibility and frame
      # delivery — so a headless run that cannot see what it is testing fails
      # loudly rather than reporting green. That is not hypothetical: the whole
      # M23.1 overlay investigation was a browser silently delivering no frames.
      - name: Start the stub platform and the portal
        working-directory: developer-portal
        env:
          STUB_PORT: "4600"
          # Short enough that every navigation lands inside the middleware's
          # two-minute refresh skew, so the refresh and race checks exercise the
          # path they claim to rather than passing because nothing expired.
          STUB_ACCESS_TTL: "60"
        run: |
          set -euo pipefail
          node scripts/stub-platform.mjs &
          PF_GATEWAY_URL=http://localhost:4600 \
          PORTAL_PUBLIC_ORIGIN=http://localhost:3601 \
          PORTAL_SESSION_SECRET=ci-only-session-secret-not-used-anywhere-else \
          PORT=3601 npm start &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3601/login; then exit 0; fi
            sleep 1
          done
          echo "the portal did not come up"
          exit 1

      - name: Authentication flows
        working-directory: developer-portal
        env:
          BASE: http://localhost:3601
          STUB: http://localhost:4600
        run: node scripts/verify-auth.mjs

      # M23.2a. The unit suite proves each step of the entry flow in isolation, with the
      # step before it mocked; what it structurally cannot prove is the join —
      # that a browser which has never seen this application can start on the
      # landing page and reach a working dashboard with nobody intervening. That
      # is one continuous journey through five routes, three redirects and two
      # cookie rewrites, and it is the milestone's stated completion criterion.
      #
      # It runs after the authentication suite rather than before it: both reset
      # the stub, and the authentication suite's refresh checks are the ones that
      # care about a quiet starting state.
      - name: Public entry flow
        working-directory: developer-portal
        env:
          BASE: http://localhost:3601
          STUB: http://localhost:4600
        run: node scripts/verify-public.mjs

      # M23.3. The shell and the data layer: that a pasted id reaches the platform through
      # the session and comes back as a row, that focus lands on the incoming page's
      # heading after a client-side navigation, and — the security half — that a browser
      # holding a valid session still cannot talk the read route into a mutation or into
      # choosing its own mode.
      - name: Shell and data layer
        working-directory: developer-portal
        env:
          BASE: http://localhost:3601
          STUB: http://localhost:4600
        run: node scripts/verify-shell.mjs

      # M23.4. Merchant settings: that a saved business name or callback URL is genuinely
      # stored by merchant-service rather than only echoed back by the form. Persistence
      # is asserted against the platform's own state, so these checks are about storage
      # rather than about how a dynamic route caches.
      #
      # M23.4's other half, onboarding, is not repeated here — M23.2a had to build it to
      # give a new account any way to reach the dashboard, and the public-flow step above
      # already walks a browser through it end to end.
      #
      # It raises the stub's access-token life for its own duration and restores it
      # afterwards. Sixty seconds is shorter than the middleware's refresh skew, which is
      # exactly what the authentication suite needs and exactly what makes a longer
      # journey re-render mid-block against a lookup the platform has already refused.
      - name: Merchant settings
        working-directory: developer-portal
        env:
          BASE: http://localhost:3601
          STUB: http://localhost:4600
        run: node scripts/verify-settings.mjs

      # M23.5. The one screen in the product that shows a secret. The unit suite proves the
      # lifecycle; only a browser can prove the property the screen exists for — that the raw key
      # appears once and is then genuinely unreachable. This reads the real value out of the reveal
      # and goes looking for it in the page source, the URL, the cookies, both storages, and a
      # fresh load of the same route.
      - name: API key management
        working-directory: developer-portal
        env:
          BASE: http://localhost:3601
          STUB: http://localhost:4600
        run: node scripts/verify-api-keys.mjs

      # M23.6. The first list screen, and therefore the first real exercise of M23.3's cursor
      # pagination: that the cursor advances without repeating or skipping a row, that a filter
      # reaches the platform rather than being applied to a page that arrived unfiltered, and that
      # switching mode replaces every row instead of showing one mode's money under the other's
      # heading. The stub holds a different ledger per mode precisely so that last one can fail.
      - name: Payments list
        working-directory: developer-portal
        env:
          BASE: http://localhost:3601
          STUB: http://localhost:4600
        run: node scripts/verify-payments.mjs

      - name: Interaction and animation behaviour
        working-directory: developer-portal
        env:
          BASE: http://localhost:3601
        run: node scripts/verify-interactions.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built from ./developer-portal, not the repository root: .dockerignore
      # excludes this directory from the root context precisely so the nine
      # service images do not carry it, which means it cannot be built from there.
      - name: Build the portal image
        uses: docker/build-push-action@v6
        with:
          context: ./developer-portal
          file: ./developer-portal/Dockerfile
          push: false
          load: true
          tags: paymentflow/developer-portal:ci

      # The same three properties every service image is asserted for. A portal
      # image that ran as root would be the one image in the repository that did.
      - name: Image runs as non-root, exposes its port, and has a healthcheck
        run: |
          set -euo pipefail
          image=paymentflow/developer-portal:ci
          user=$(docker image inspect "$image" --format '{{.Config.User}}')
          if [ "$user" != "paymentflow" ]; then
            echo "image runs as '$user', expected 'paymentflow'"
            exit 1
          fi
          docker image inspect "$image" --format '{{json .Config.ExposedPorts}}' | grep -q '3000/tcp'
          docker image inspect "$image" --format '{{json .Config.Healthcheck}}' | grep -q 'wget'

      - name: Summary
        if: always()
        run: |
          echo "### Developer portal" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: built, not pushed" >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: Docker build (${{ matrix.service }})
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # See the header comment / D58 — caps concurrent image builds instead of
      # letting all 9 matrix legs fire at once.
      max-parallel: 4
      matrix:
        include:
          - service: gateway-service
            port: 8080
          - service: identity-service
            port: 8081
          - service: merchant-service
            port: 8082
          - service: payment-service
            port: 8083
          - service: transaction-service
            port: 8084
          - service: audit-service
            port: 8091
          - service: notification-service
            port: 8092
          - service: analytics-service
            port: 8093
          # M21.6: sandbox-service was missing from this matrix. It has been a
          # first-class service since M17 and docker-compose.yml builds it, so
          # its Dockerfile path was the one of nine that nothing in CI covered —
          # a build-arg regression there would have surfaced during a deployment
          # rather than here.
          - service: sandbox-service
            port: 8094
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR image names must be lowercase; github.repository_owner isn't
      # guaranteed to be (e.g. "IsaHaameem"). Computed once here rather than
      # repeating a shell lowercase in every tag reference below.
      - name: Compute image repository prefix
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${owner_lc}" >> "$GITHUB_ENV"

      # Not logged in to any registry — this build never pushes (push: false
      # below). To enable pushing to GHCR in a later milestone, uncomment:
      #
      # - name: Log in to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      #
      # ...and also add `packages: write` to the top-level `permissions:` block.

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            SERVICE_MODULE=${{ matrix.service }}
            SERVICE_PORT=${{ matrix.port }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          # Loaded into the local Docker daemon for the verification step
          # below, never pushed to any registry — deployment/registry
          # publishing is out of scope for this milestone (flip this to
          # `push: true` once the login step above is enabled).
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Real, automated verification (not just "it built") — asserts the image
      # actually has the non-root user, exposed port, and healthcheck M9
      # established, so a Dockerfile regression that silently drops one of
      # them fails CI instead of surfacing later during manual verification.
      - name: Verify image (non-root user, exposed port, healthcheck)
        run: |
          set -e
          tag="${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}"
          user=$(docker inspect -f '{{ .Config.User }}' "$tag")
          echo "User: $user"
          [ "$user" = "paymentflow:paymentflow" ] || { echo "::error::expected non-root user paymentflow:paymentflow, got '$user'"; exit 1; }

          exposed=$(docker inspect -f '{{ range $p, $_ := .Config.ExposedPorts }}{{ $p }}{{ end }}' "$tag")
          echo "Exposed: $exposed"
          echo "$exposed" | grep -q "${{ matrix.port }}/tcp" || { echo "::error::expected port ${{ matrix.port }}/tcp exposed, got '$exposed'"; exit 1; }

          healthcheck=$(docker inspect -f '{{ .Config.Healthcheck }}' "$tag")
          echo "Healthcheck: $healthcheck"
          [ "$healthcheck" != "<nil>" ] || { echo "::error::expected a HEALTHCHECK, found none"; exit 1; }

      - name: Summary
        if: always()
        run: |
          echo "### Docker build — ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: \`${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest\`, \`${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pushed: no (deployment/registry publishing deferred, see workflow header)" >> "$GITHUB_STEP_SUMMARY"
