# Centralized dependency & plugin versions (Gradle Version Catalog).
# One place to bump versions; every module references these aliases.
#
# NOTE: Actual libraries are pulled in from the imported BOMs (see platform-bom),
# so most artifacts do NOT need an explicit version here — the BOM governs it.
# This catalog pins the BOM versions and build plugins.

[versions]
# Java language level the whole project compiles against (LTS).
java = "25"

# Spring Boot 4.0 (GA Nov 2025) governs the vast majority of dependency versions.
springBoot = "4.0.2"

# Spring Cloud release train aligned with Spring Boot 4.0.
# NOTE: verify/adjust this alias when the Gateway module is introduced (M3).
springCloud = "2025.1.0"

# Resilience4j — introduced in M8 (payment-service's circuit breaker/retry/bulkhead/
# timeout around its one synchronous cross-service call to merchant-service).
resilience4j = "2.3.0"

# Awaitility — deterministic polling for async test assertions (Kafka-consumer-backed
# integration tests), replacing hand-rolled awaitTrue()/Thread.sleep poll loops.
awaitility = "4.3.0"

# springdoc-openapi — introduced in M21.1 (the OpenAPI 3.1 description of the public
# /v1 surface). The 3.0.x line is the one built for Spring Boot 4 / Spring Framework 7;
# 2.8.x targets Boot 3 and is not an option here at all, because springdoc 3 compiles
# against Boot 4's split modules (spring-boot-webmvc, spring-boot-jackson) that Boot 3
# does not have.
#
# NOT the newest release (3.0.3), and the reason is a dependency fact rather than a
# runtime one. Each springdoc release's POM inherits Spring Boot's dependency management
# from `spring-boot-starter-parent`, so the Boot version springdoc was built against
# becomes a hard requirement in its published POM, and Gradle's conflict resolution
# raises the whole platform to it:
#
#   springdoc 3.0.0 -> Boot 4.0.0    3.0.2 -> Boot 4.0.3
#   springdoc 3.0.1 -> Boot 4.0.1    3.0.3 -> Boot 4.0.5
#
# 3.0.3 therefore drags every module in this monorepo from Boot 4.0.2 to 4.0.5 (and
# Jackson 3.0.4 -> 3.1.0, Jackson 2.20.2 -> 2.21.1) — a platform upgrade smuggled in by a
# documentation dependency, which is not what M21.1 is for. 3.0.1 is the newest release
# whose Boot floor (4.0.1) sits *below* 4.0.2, so the BOM's 4.0.2 wins on every
# coordinate and the platform is unchanged. Verified with `dependencyInsight`, not
# assumed. Revisit when this platform's own Boot version moves (D147, §17/M21.1).
springdoc = "3.0.1"

[libraries]
# Imported as platforms (BOMs) by platform-bom — these align all transitive versions.
spring-boot-bom = { group = "org.springframework.boot", name = "spring-boot-dependencies", version.ref = "springBoot" }
spring-cloud-bom = { group = "org.springframework.cloud", name = "spring-cloud-dependencies", version.ref = "springCloud" }
resilience4j-bom = { group = "io.github.resilience4j", name = "resilience4j-bom", version.ref = "resilience4j" }
# Constrained (not imported as a platform) by platform-bom — see the comment there for
# why springdoc's own BOM must not be imported.
springdoc-starter-webmvc-api = { group = "org.springdoc", name = "springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
awaitility = { group = "org.awaitility", name = "awaitility", version.ref = "awaitility" }

[plugins]
# Applied by service modules starting in later milestones (not in M0).
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
